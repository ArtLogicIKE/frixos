name: CI

on:
  push:
  pull_request:

jobs:
  ui-settings:
    name: UI settings contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test every UI setting against the firmware apply path
        run: python tools/test_ui_settings.py
